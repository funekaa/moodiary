name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          cache: true

      - name: Patch Flutter Gradle Plugin
        run: |
          FLUTTER_GRADLE_DIR="$(dirname $(which flutter))/../packages/flutter_tools/gradle"
          if [ -d "$FLUTTER_GRADLE_DIR" ]; then
            echo "Configuring repositories for $FLUTTER_GRADLE_DIR"
            cat << 'EOF' > "$FLUTTER_GRADLE_DIR/settings.gradle.kts"
          pluginManagement {
              repositories {
                  gradlePluginPortal()
                  google()
                  mavenCentral()
              }
          }
          EOF
            cat "$FLUTTER_GRADLE_DIR/settings.gradle.kts"
          fi

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore (Optional)
        if: env.ANDROID_KJS != ''
        run: |
          echo "${{ secrets.ANDROID_KJS }}" | base64 --decode > android/app/key.jks
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}

      - name: Create local.properties (Optional)
        if: env.ANDROID_STORE_PASSWORD != ''
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/local.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/local.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK (Split Per ABI)
        run: flutter build apk --release --split-per-abi

      - name: Build Universal APK
        run: flutter build apk --release

      - name: Collect and Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v$VERSION"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "Detected tag: $TAG"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp -r artifacts/android/*.apk release-assets/ || true
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Moodiary ${{ env.TAG_NAME }}
          body: |
            ## Moodiary ${{ env.TAG_NAME }} 发布说明

            ### 🚀 优化与功能更新
            - **大幅缩减安装包体积**：清理废弃 TFLite 离线推理库，包体积降低 15MB~25MB+。
            - **Rust Jieba 精简分词**：关闭全量静态词典，使用轻量化词典以精简原生库大小。
            - **多项核心 Bug 修复**：修复数据库迁移版本比对错误、备份打包并发竞争漏洞、时间窗口加密跨午夜失效问题、WebDAV 类型转换异常、音频加载容错与系统配置默认值保护。

            ### 📦 下载说明
            - `app-arm64-v8a-release.apk`：适用于大多数现代 Android 手机（推荐）。
            - `app-armeabi-v7a-release.apk`：适用于较旧的 32 位 Android 设备。
            - `app-release.apk`：包含全部架构的通用安装包。
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}