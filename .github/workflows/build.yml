name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          cache: true

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore (Optional)
        if: env.ANDROID_KJS != ''
        run: |
          echo "${{ secrets.ANDROID_KJS }}" | base64 --decode > android/app/key.jks
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}

      - name: Create local.properties (Optional)
        if: env.ANDROID_STORE_PASSWORD != ''
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/local.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/local.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect and Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v$VERSION"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "Detected tag: $TAG"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          VERSION="${TAG_NAME#v}"
          for apk in artifacts/android/*.apk; do
            cp "$apk" "release-assets/moodiary-${VERSION}-arm64-v8a.apk"
          done
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Moodiary ${{ env.TAG_NAME }}
          body: |
            ## Moodiary ${{ env.TAG_NAME }} 发布说明

            ### 🐛 关键 Bug 修复
            - **修复启动闪退**：修正数据库迁移时序错误（迁移在数据库初始化之前执行导致崩溃）。
            - **移除 fvp (FFmpeg) 依赖**：消除潜在的原生库初始化崩溃风险。

            ### 📦 极致体积优化
            - **移除 fvp 嵌入式 FFmpeg**：减小约 12MB（Android 已内置 ExoPlayer，无需 FFmpeg）。
            - **启用 R8 代码混淆与资源缩减**：减小约 5MB。
            - **裁剪 Rust image/zip crate**：移除 AV1 编码器、EXR 等冗余格式支持，减小约 3.5MB。
            - 总计预计减小 **~20MB**，APK 从 52MB 降至约 30MB。

            ### 📥 下载
            - `moodiary-{version}-arm64-v8a.apk`：适用于绝大多数主流 Android 手机（64位 ARM v8 架构）。
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}