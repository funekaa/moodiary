name: Build & Release

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    name: Build APK

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set Up Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Install jq
        run: sudo apt-get install -y jq

      - name: Set Up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.1'
          cache: true

      - name: Set Up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install Dependencies
        run: flutter pub get

      - name: Decode Keystore (Optional)
        if: env.ANDROID_KJS != ''
        run: |
          echo "${{ secrets.ANDROID_KJS }}" | base64 --decode > android/app/key.jks
        env:
          ANDROID_KJS: ${{ secrets.ANDROID_KJS }}

      - name: Create local.properties (Optional)
        if: env.ANDROID_STORE_PASSWORD != ''
        run: |
          echo "storePassword=${{ secrets.ANDROID_STORE_PASSWORD }}" > android/local.properties
          echo "keyPassword=${{ secrets.ANDROID_KEY_PASSWORD }}" >> android/local.properties
        env:
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build APK (arm64-v8a)
        run: flutter build apk --release --target-platform android-arm64

      - name: Collect and Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: build/app/outputs/flutter-apk/*.apk

  release:
    runs-on: ubuntu-latest
    name: Publish Release
    needs: [ build-apk ]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Download APK Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-apk
          path: artifacts/android

      - name: Extract Version
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            VERSION=$(grep "^version:" pubspec.yaml | awk '{print $2}' | cut -d'+' -f1)
            TAG="v$VERSION"
          fi
          echo "TAG_NAME=$TAG" >> $GITHUB_ENV
          echo "Detected tag: $TAG"

      - name: Prepare Release Assets
        run: |
          mkdir -p release-assets
          cp -r artifacts/android/*.apk release-assets/ || true
          ls -la release-assets

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG_NAME }}
          name: Moodiary ${{ env.TAG_NAME }}
          body: |
            ## Moodiary ${{ env.TAG_NAME }} 发布说明

            ### 🚀 优化与功能更新
            - **极致体积优化**：专为主流 Android arm64-v8a 架构优化构建，大幅精简包体积并提升运行性能。
            - **Rust Jieba 精简分词**：关闭全量静态词典，使用轻量化词典以精简原生库大小。
            - **多项核心 Bug 修复**：修复数据库迁移版本比对错误、备份打包并发竞争漏洞、时间窗口加密跨午夜失效问题、WebDAV 类型转换异常、音频加载容错与系统配置默认值保护。

            ### 📦 下载说明
            - `app-release.apk`：适用于目前绝大多数主流 Android 手机（64位 ARM v8 架构）。
          files: release-assets/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}